[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "eatmud"
version = "0.1.0"
description = "A Python wrapper for eatmud core"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "numpy>=1.24.4",
    "openpyxl>=3.1.5",
]

[tool.maturin]
manifest-path = "py_bind/Cargo.toml"
module-name = "eatmud._core"
binding = "pyo3"
features = ["pyo3/extension-module"]
generate-stubs = true
